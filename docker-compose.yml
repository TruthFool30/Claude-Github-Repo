# Hearth with Docker Compose:
#   docker compose up -d                      # start on http://localhost:8080
#   docker compose run --rm hearth node --disable-warning=ExperimentalWarning server/src/seed.js   # optional demo family
services:
  hearth:
    build: .
    image: hearth:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set COOKIE_SECURE=1 when Hearth is served over HTTPS (e.g. behind a reverse proxy).
      COOKIE_SECURE: "0"
      # Behind a reverse proxy in another container/host, trust it so rate limits see real client IPs
      # (e.g. "1" for one proxy hop, or its subnet). Default trusts only loopback.
      # TRUST_PROXY: "1"
      # Encryption key for vault documents and info cards (32 bytes: `openssl rand -base64 32`).
      # Unset, a key is generated into the volume as /app/data/hearth.key — then a backup of the
      # volume holds both the data and its key. Losing the key loses the encrypted documents.
      # HEARTH_ENCRYPTION_KEY: "paste-your-key-here"
    volumes:
      - hearth-data:/app/data

volumes:
  hearth-data:
